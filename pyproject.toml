[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "capture-recovery"
version = "0.1.0"
description = "Recovery tool for corrupted Capture lighting projects"
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Stéphan Hennaut" }
]


dependencies = [
    "PySide6>=6.8"
]


[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0"
]


[project.scripts]
capture-recovery = "capture_recovery.cli:main"
capture-recovery-gui = "capture_recovery.gui_app:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = [
    "src"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "--strict-markers"
]